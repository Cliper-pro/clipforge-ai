<head>

* {
  box-sizing: border-box;
  margin: 0;
  padding: 0;
}

body {
  background: #080b12;
  color: white;
  font-family: Arial, sans-serif;
  padding: 22px;
}

header {
  display: flex;
  justify-content: space-between;
  align-items: center;
  margin-bottom: 45px;
}

.logo {
  font-size: 25px;
  font-weight: bold;
  color: #a78bfa;
}

.badge {
  background: #19152c;
  color: #bda8ff;
  padding: 8px 12px;
  border-radius: 20px;
  font-size: 12px;
}

h1 {
  font-size: 36px;
  margin-bottom: 12px;
}

p {
  color: #9299aa;
  line-height: 1.6;
}

.container {
  max-width: 650px;
  margin: auto;
}

.card {
  background: #111722;

label {
  display: block;
  margin-bottom: 12px;
  font-weight: bold;
}

input, select {

  padding: 15px;

  border: 1px solid #343e51;
  background: #090e18;
  color: white;
  margin-bottom: 18px;
  font-size: 15px;
}

button {
  width: 100%;
  padding: 16px;
  background: #8055ee;
  border: none;
  border-radius: 10px;
  color: white;
  font-size: 16px;
  font-weight: bold;
  cursor: pointer;
}

button:active {
  opacity: 0.8;
}

.secondary {
  background: #202b3c;
  margin-top: 12px;
}
